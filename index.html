<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#152238" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hex Worlds</title>
    <style>
      .universe-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #070b14;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 13px;
        color: #8b9bb4;
      }
      .universe-boot[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="universe-boot" class="universe-boot" role="status">
      <div id="universe-boot-copy">Preparing the universe</div>
      <progress id="universe-boot-bar" max="100" value="0"></progress>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
