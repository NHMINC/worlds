# Publish the production build to GitHub Pages on every push to main.
# Site: https://nhminc.github.io/worlds/
#
# One-time (repo Settings → Pages):
#   Source: GitHub Actions
# Free plan: the repository must be public. Private Pages needs GitHub Team/Pro.
# The published site is public either way.
#
# Actions are pinned to commit SHAs (immutable). Dependabot keeps them current.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-import.ts
      - run: npm run icons
      - run: npm run build
        env:
          BASE_PATH: /worlds/
          VITE_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
